name: Rewards validation
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      APP_URL: http://127.0.0.1:18480
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/rewards_test
      CHAIN_ID: "1919"
      CHAIN_RPC_URL: https://rpc.turkscan.com
      CHAIN_WSS_URL: wss://evm-ws.turkscan.com
      CHAIN_EXPLORER_URL: https://turkscan.com
      REWARD_CLAIMS_PAUSED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
# Full PostgreSQL/Redis integration, browser, Foundry, migrations and production
# health gates run on REWARDSTEST via validate-release.sh before promotion.
# CI does not deploy, load production credentials or enable payouts.
