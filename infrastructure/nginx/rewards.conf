log_format rewards_safe '$remote_addr - $time_iso8601 "$request_method $uri $server_protocol" $status $body_bytes_sent';
server {
 listen 80;
 server_name rewards.turkscan.com;
 location ^~ /.well-known/acme-challenge/ { root /var/www/rewards.turkscan.com/.acme; }
 location / { return 301 https://rewards.turkscan.com$request_uri; }
}
server {
 listen 443 ssl;
 server_name rewards.turkscan.com;
 ssl_certificate /etc/letsencrypt/live/rewards.turkscan.com/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/rewards.turkscan.com/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 client_max_body_size 6m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 access_log /var/log/nginx/rewards.access.log rewards_safe;
 error_log /var/log/nginx/rewards.error.log;
 location /api/ {
  proxy_pass http://127.0.0.1:18291;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
 }
 location / {
  proxy_pass http://127.0.0.1:18191;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
 }
}
