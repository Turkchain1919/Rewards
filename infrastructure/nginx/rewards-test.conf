log_format rewards_test_safe '$remote_addr - $time_iso8601 "$request_method $uri $server_protocol" $status $body_bytes_sent';
server {
 listen 127.0.0.1:18480;
 server_name localhost;
 client_max_body_size 6m;
 access_log /var/log/nginx/rewards-test.access.log rewards_test_safe;
 location /api/ {
  proxy_pass http://127.0.0.1:18290;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-For $remote_addr;
 }
 location / {
  proxy_pass http://127.0.0.1:18190;
  proxy_set_header Host $http_host;
 }
}
